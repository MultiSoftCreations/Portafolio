<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Inicia sesión en CODEVERSE" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Iniciar sesión — CODEVERSE</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at top, #12121a 0%, #0a0a0f 70%);
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: rgba(20, 20, 30, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      text-align: center;
    }
    .login-card .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
      text-decoration: none;
      color: inherit;
    }
    .login-card .logo img {
      width: 42px;
      height: 42px;
      border-radius: 10px;
    }
    .login-card h1 {
      font-size: 1.5rem;
      margin: 0 0 0.4rem;
    }
    .login-card .subtitle {
      color: #999;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.9rem 1.25rem;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      background: #fff;
      color: #1a1a1a;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-google:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .btn-google:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }
    .btn-google svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }
    .login-msg {
      margin-top: 1.25rem;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    .login-msg.error {
      display: block;
      background: rgba(255,70,70,0.12);
      color: #ff6b6b;
      border: 1px solid rgba(255,70,70,0.3);
    }
    .login-footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #666;
    }
    .login-footer a {
      color: #a29bfe;
      text-decoration: none;
    }
  </style>
</head>
<body class="login-page">
  <div class="login-card">
    <a href="index.html" class="logo">
      <img src="assets/img/codeverse-logo.png" alt="CODEVERSE" />
      <span style="font-weight:700;font-size:1.2rem;">CODEVERSE</span>
    </a>
    <h1>Inicia sesión</h1>
    <p class="subtitle">Accede a tus cursos, proyectos y el editor LIVE</p>

    <button class="btn-google" id="btn-google">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continuar con Google
    </button>

    <div class="login-msg" id="msg"></div>

    <div class="login-footer">
      Al continuar aceptas los <a href="terminos.html">Términos</a> y la <a href="privacidad.html">Privacidad</a>.
    </div>
  </div>

  <script type="module">
    import { loginWithGoogle, onUserChanged, hasValidAITunnelSession } from "./js/auth.js";

    // Si ya está logueado o tiene sesión de IA, redirigir
    onUserChanged((user) => {
      if (user || hasValidAITunnelSession()) {
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get("redirect") || "dashboard.html";
        window.location.replace(redirect);
      }
    });

    const btn = document.getElementById("btn-google");
    const msg = document.getElementById("msg");

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      btn.textContent = "Conectando...";
      msg.className = "login-msg";
      try {
        await loginWithGoogle();
        // onUserChanged se encargará de redirigir
      } catch (err) {
        console.error(err);
        msg.textContent = err.message || "No se pudo iniciar sesión. Intenta de nuevo.";
        msg.className = "login-msg error";
        btn.disabled = false;
        btn.innerHTML = `
          <svg viewBox="0 0 24 24" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continuar con Google`;
      }
    });
  </script>
</body>
</html>
