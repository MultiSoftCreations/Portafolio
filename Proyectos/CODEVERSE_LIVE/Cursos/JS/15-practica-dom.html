<body class="course-page">
  <header class="header" id="header">
    <div class="container header__inner">
      <a href="../../index.html" class="logo">
        <img src="../../assets/img/codeverse-logo.png" alt="CODEVERSE" class="logo__img" />
        <span class="logo__text">CODEVERSE</span>
      </a>
      <nav class="nav" id="nav">
        <a href="../../index.html" class="nav__link">Inicio</a>
        <a href="../../academy.html" class="nav__link active">Academia</a>
        <a href="../../live.html" class="nav__link">LIVE</a>
        <a href="../../dashboard.html" class="nav__link">Dashboard</a>
      </nav>
      <button class="menu-toggle" id="menu-toggle" aria-label="Menú"><span></span><span></span><span></span></button>
    </div>
  </header>
  <main class="lesson">
    <div class="container lesson__wrap">
      <div class="lesson__crumb">
        <a href="../../academy.html">Academia</a><span>/</span>
        <a href="../../academy.html?course=js">Introducción a JavaScript</a><span>/</span>
        <span>Práctica 15</span>
      </div>
      <div id="lesson-gate" class="lesson-gate">Comprobando acceso…</div>
      <article id="lesson-content" class="lesson__content" hidden>
        <p class="lesson__meta"><span class="type-pill type-pill--practice">Práctica</span> · 15 de 20 · Principiante</p>
        <h1 class="lesson__title">Práctica 5A · Estilo desde JS</h1>
        <div class="lesson__body">

          <p>Cambia el color del título y el texto del mensaje.</p>
          
          <div class="lesson-mini" data-lesson-mini data-mode="html-js" data-course="js" data-persist="1">
            <div class="lesson-mini__bar">
              <span>Tu programa · HTML + JS</span>
              <div class="lesson-mini__tabs">
                <button type="button" class="lesson-mini__tab is-active" data-mini-tab="html">HTML</button>
                <button type="button" class="lesson-mini__tab" data-mini-tab="js">JS</button>
              </div>
              <div class="lesson-mini__bar-actions">
                <button type="button" class="btn btn--sm btn--ghost lesson-mini__reset">Reiniciar plantilla</button>
                <button type="button" class="btn btn--sm btn--primary lesson-mini__run">Ejecutar</button>
              </div>
            </div>
            <div class="lesson-mini__grid">
              <textarea class="lesson-mini__code" spellcheck="false"><!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mi programa JS</title>
</head>
<body>
  <h1 id="titulo">Hola JavaScript</h1>
  <p id="mensaje">Aquí verás el resultado de tu código.</p>
  <button id="btn">Púlsame</button>
</body>
</html></textarea>
              <textarea class="lesson-mini__code-js" spellcheck="false" hidden></textarea>
              <iframe class="lesson-mini__preview" sandbox="allow-scripts" title="Vista previa"></iframe>
            </div>
            <p class="lesson-mini__hint">textContent y style.color</p>
          </div>

        </div>
        <div class="lesson__actions">
          <a class="btn btn--ghost btn--sm" href="../../academy.html?course=js">Volver al curso</a>
          <button type="button" class="btn btn--primary btn--sm" id="btn-complete">Marcar como completada y continuar</button>
        </div>
        <p class="lesson__hint" id="lesson-status"></p>
      </article>
    </div>
  </main>
  <script src="../../js/main.js"></script>
  <script type="module">
    import { guardLessonPage, completeLesson, isLessonCompleted } from "../../js/courses.js";
    import { initLessonInteractives, persistAllWorkspaces } from "../../js/lesson-mini.js";
    const COURSE_ID = "js";
    const LESSON_ID = "15-practica-dom";
    const gate = document.getElementById("lesson-gate");
    const content = document.getElementById("lesson-content");
    const btn = document.getElementById("btn-complete");
    const status = document.getElementById("lesson-status");
    try {
      const { course, progress } = await guardLessonPage(COURSE_ID, LESSON_ID);
      gate.hidden = true;
      content.hidden = false;
      await initLessonInteractives(content);
      if (isLessonCompleted(progress, LESSON_ID)) {
        status.textContent = "Ya completaste este paso. Puedes repasar o continuar.";
        btn.textContent = "Continuar";
        btn.disabled = false;
      }
      btn.addEventListener("click", async () => {
        const exam = content.querySelector("[data-lesson-exam]");
        if (exam && exam.dataset.passed !== "1" && !isLessonCompleted(progress, LESSON_ID)) {
          status.textContent = "Primero califica el examen y aprueba para continuar.";
          return;
        }
        persistAllWorkspaces(content);
        btn.disabled = true;
        btn.textContent = "Guardando…";
        try {
          await completeLesson(course, LESSON_ID);
          const idx = course.lessons.findIndex((l) => l.id === LESSON_ID);
          const next = course.lessons[idx + 1];
          if (next) window.location.href = next.file;
          else {
            status.textContent = "¡Curso completado!";
            setTimeout(() => { window.location.href = "../../academy.html?course=js"; }, 1000);
          }
        } catch (err) {
          status.textContent = err.message || "Error al guardar";
          btn.disabled = false;
          btn.textContent = "Reintentar";
        }
      });
    } catch (err) {
      if (!(err && (err.message === "login_required" || err.message === "lesson_locked" || err.message === "access_blocked"))) {
        gate.textContent = "No se pudo abrir. Vuelve a Academia.";
        console.error(err);
      }
    }
  </script>
</body>
</html>
