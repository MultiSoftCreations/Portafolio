name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install send2trash pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --name MultiSoftCleaner --windowed --onefile --hidden-import=send2trash main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MultiSoftCleaner-Windows
          path: dist/MultiSoftCleaner.exe
